<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>서비스 이용약관</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height:1.6; margin:24px; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    li { margin: .4rem 0; }
  </style>
</head>
<body>
  <h1>[서비스 이용약관]</h1>
  <ol>
    <li>본 약관은 서비스 이용에 관한 권리·의무 및 책임사항을 규정합니다.</li>
    <li>회원은 서비스를 이용하기 전에 본 약관을 주의 깊게 읽어야 합니다.</li>
    <li>회사는 관련 법령을 위반하지 않는 범위에서 약관을 개정할 수 있습니다.</li>
    <li>기타 상세 조항은 서비스 내 고지 또는 별도 정책을 따릅니다.</li>
  </ol>
</body>
